<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Life OS | Daily Routines</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
</head>
<body>
  <div class="life-os-shell">
    <aside class="sidebar glass-card">
      <div class="brand">
        <div class="brand-mark"></div>
        <div>
          <h1>Life OS</h1>
          <p>Personal OS</p>
        </div>
      </div>
      <nav class="nav-links">
        <a href="index.html"><span>🏠 Dashboard</span></a>
        <a href="calendar.html"><span>📅 Planner</span></a>
        <a class="active" href="routines.html"><span>⚡ Daily Routine</span></a>
        <a href="journal.html"><span>📖 Journal</span></a>
        <a href="ai-assistant.html"><span>🤖 AI Assistant</span></a>
        <a href="reports.html"><span>📊 Reports</span></a>
        <a href="tasks.html"><span>🎯 Goals & Habits</span></a>
        <a href="settings.html"><span>⚙️ Settings</span></a>
      </nav>
      <div class="sidebar-footer glass-card small-card">
        <div class="profile-circle">RS</div>
        <div>
          <h2>RS</h2>
          <p>Keep building.</p>
        </div>
      </div>
    </aside>

    <main class="main-grid">
      <section class="glass-card" style="grid-column: span 12; padding: 28px;">
        <div class="widget-header">
          <div>
            <h3>Daily Routines & Habits</h3>
            <p>Automate recurring tasks, track streaks, and earn XP every day.</p>
          </div>
          <button id="addRoutineBtn" class="btn-primary" style="width: auto; padding: 10px 20px;">+ New Routine</button>
        </div>

        <div id="routinesList" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; margin-top: 20px;">
          <!-- Rendered dynamically -->
        </div>
      </section>
    </main>
  </div>

  <!-- Routine Modal -->
  <div class="modal-backdrop hidden" id="routineModalBackdrop"></div>
  <div class="daily-log-modal hidden glass-card" id="routineModal" style="width: min(560px, 92vw);">
    <div class="modal-header">
      <h2 id="routineModalTitle">Add Daily Routine</h2>
      <button id="closeRoutineModal">×</button>
    </div>
    <form id="routineForm">
      <input type="hidden" id="routineId" />
      <div class="form-row">
        <label>Routine Title<input type="text" id="routineTitle" required placeholder="e.g., Morning Exercise" /></label>
        <label>Icon / Emoji<input type="text" id="routineIcon" value="⚡" style="width: 70px;" /></label>
      </div>
      <div class="form-row">
        <label>Target Start Time<input type="time" id="routineStartTime" value="06:00" /></label>
        <label>Duration (mins)<input type="number" id="routineDuration" value="30" min="5" max="300" /></label>
      </div>
      <div class="form-row">
        <label>Priority
          <select id="routinePriority">
            <option value="high">High Priority</option>
            <option value="medium" selected>Medium Priority</option>
            <option value="low">Low Priority</option>
          </select>
        </label>
        <label>XP Reward<input type="number" id="routineXP" value="50" min="10" max="500" /></label>
      </div>
      <div class="form-row">
        <label>Accent Color<input type="color" id="routineColor" value="#8652ff" style="height: 42px; padding: 2px;" /></label>
        <label style="display: flex; align-items: center; gap: 10px; margin-top: 24px;">
          <input type="checkbox" id="routineEnabled" checked /> Enabled Routine
        </label>
      </div>
      <button class="btn-primary" type="submit" style="margin-top: 16px;">Save Routine</button>
    </form>
  </div>

  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/routines.js"></script>
</body>
</html>
