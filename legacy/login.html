<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Life OS | Sign In</title>
  <meta name="description" content="Sign in to Life OS – your personal productivity operating system." />
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  <style>
    body {
      display: grid;
      place-items: center;
      min-height: 100vh;
      background: #02040c;
    }
    .auth-wrap {
      width: min(460px, 94vw);
      animation: fadeIn 0.4s ease;
    }
    @keyframes fadeIn { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:none; } }
    .auth-container {
      padding: 40px 36px;
      border-radius: 28px;
    }
    .auth-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 28px;
      background: rgba(255,255,255,0.05);
      padding: 6px;
      border-radius: 18px;
    }
    .auth-tab {
      flex: 1;
      padding: 10px;
      border-radius: 12px;
      background: transparent;
      color: #9aa3ff;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s ease;
      border: none;
    }
    .auth-tab.active {
      background: rgba(139,92,246,0.3);
      color: #fff;
      box-shadow: 0 4px 15px rgba(139,92,246,0.2);
    }
    .google-btn {
      width: 100%;
      padding: 13px 18px;
      border-radius: 16px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      color: #fff;
      font-weight: 600;
      font-size: 0.92rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
      margin-bottom: 22px;
    }
    .google-btn:hover { background: rgba(255,255,255,0.14); transform: translateY(-1px); }
    .divider {
      display: flex;
      align-items: center;
      text-align: center;
      color: #9aa3ff;
      font-size: 0.8rem;
      margin: 20px 0;
      gap: 12px;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    .auth-input-wrap {
      margin-bottom: 16px;
    }
    .auth-input-wrap label {
      display: block;
      font-size: 0.85rem;
      color: #c7d1ff;
      margin-bottom: 6px;
      font-weight: 500;
    }
    .auth-input-wrap input {
      width: 100%;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      color: #fff;
      padding: 13px 14px;
      border-radius: 14px;
      font-size: 0.92rem;
      transition: border-color 0.2s ease;
      box-sizing: border-box;
    }
    .auth-input-wrap input:focus {
      outline: none;
      border-color: #8b5cf6;
      background: rgba(139,92,246,0.08);
    }
    .pass-wrap { position: relative; }
    .pass-wrap input { padding-right: 46px; }
    .toggle-pass {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #9aa3ff;
      font-size: 1rem;
      cursor: pointer;
      padding: 4px;
    }
    .auth-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 22px;
      font-size: 0.85rem;
      color: #9aa3ff;
    }
    .auth-row label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
    .auth-row a { color: #8b5cf6; }
    .auth-row a:hover { color: #a78bfa; }
    .auth-msg {
      margin: 14px 0 0;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 0.88rem;
      font-weight: 500;
      display: none;
    }
    .auth-msg.error { background: rgba(244,63,94,0.15); color: #f87171; border: 1px solid rgba(244,63,94,0.25); }
    .auth-msg.success { background: rgba(16,185,129,0.15); color: #34d399; border: 1px solid rgba(16,185,129,0.25); }
    .forgot-modal-wrap {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(4,5,14,0.8);
      backdrop-filter: blur(12px);
      z-index: 200;
      place-items: center;
    }
    .forgot-modal-wrap.open { display: grid; }
    .forgot-modal {
      width: min(400px, 92vw);
      padding: 32px;
      border-radius: 24px;
    }
  </style>
</head>
<body>
  <div class="auth-wrap">
    <div class="glass-card auth-container">
      <div style="text-align:center; margin-bottom:32px;">
        <div class="brand-mark" style="margin:0 auto 16px; width:56px; height:56px; font-size:1.6rem; display:grid; place-items:center; font-weight:800;">🚀</div>
        <h1 style="margin:0; font-size:1.7rem; font-weight:800; background:linear-gradient(135deg,#a78bfa,#60a5fa); -webkit-background-clip:text; -webkit-text-fill-color:transparent;">Life OS</h1>
        <p style="margin:8px 0 0; color:#9aa3ff; font-size:0.88rem;">Your Personal Productivity Operating System</p>
      </div>

      <div class="auth-tabs">
        <button class="auth-tab active" id="tabLogin">Sign In</button>
        <button class="auth-tab" id="tabSignup">Create Account</button>
      </div>

      <button class="google-btn" id="btnGoogleAuth">
        <svg width="20" height="20" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
        </svg>
        Continue with Google
      </button>

      <div class="divider">OR WITH EMAIL</div>

      <!-- Login Form -->
      <form id="loginForm">
        <div class="auth-input-wrap">
          <label for="loginEmail">Email Address</label>
          <input type="email" id="loginEmail" required placeholder="you@example.com" autocomplete="email" />
        </div>
        <div class="auth-input-wrap">
          <label for="loginPassword">Password</label>
          <div class="pass-wrap">
            <input type="password" id="loginPassword" required placeholder="••••••••" autocomplete="current-password" />
            <button type="button" class="toggle-pass" data-target="loginPassword">👁️</button>
          </div>
        </div>
        <div class="auth-row">
          <label><input type="checkbox" id="rememberMe" checked /> Remember Me</label>
          <a href="#" id="forgotPasswordBtn">Forgot Password?</a>
        </div>
        <button class="btn-primary" type="submit" id="loginSubmitBtn">Sign In to Life OS</button>
        <div class="auth-msg" id="loginMsg"></div>
      </form>

      <!-- Signup Form (Hidden initially) -->
      <form id="signupForm" style="display:none;">
        <div class="auth-input-wrap">
          <label for="signupName">Full Name</label>
          <input type="text" id="signupName" required placeholder="Your name" autocomplete="name" />
        </div>
        <div class="auth-input-wrap">
          <label for="signupEmail">Email Address</label>
          <input type="email" id="signupEmail" required placeholder="you@example.com" autocomplete="email" />
        </div>
        <div class="auth-input-wrap">
          <label for="signupPassword">Create Password</label>
          <div class="pass-wrap">
            <input type="password" id="signupPassword" required placeholder="Min 6 characters" minlength="6" autocomplete="new-password" />
            <button type="button" class="toggle-pass" data-target="signupPassword">👁️</button>
          </div>
        </div>
        <button class="btn-primary" type="submit" id="signupSubmitBtn" style="margin-top:8px;">Create Life OS Account</button>
        <div class="auth-msg" id="signupMsg"></div>
      </form>
    </div>
  </div>

  <!-- Forgot Password Modal -->
  <div class="forgot-modal-wrap" id="forgotModal">
    <div class="glass-card forgot-modal">
      <h3 style="margin:0 0 8px; font-size:1.1rem;">Reset Password</h3>
      <p style="margin:0 0 20px; color:#9aa3ff; font-size:0.88rem;">Enter your email address and we'll send you a reset link.</p>
      <div class="auth-input-wrap">
        <label for="forgotEmail">Email Address</label>
        <input type="email" id="forgotEmail" placeholder="you@example.com" />
      </div>
      <div class="auth-msg" id="forgotMsg"></div>
      <div style="display:flex; gap:10px; margin-top:20px;">
        <button class="btn-primary" id="forgotSubmitBtn" style="width:auto; padding:12px 22px;">Send Reset Link</button>
        <button id="forgotCancelBtn" style="background:rgba(255,255,255,0.08); color:#fff; border:1px solid rgba(255,255,255,0.12); padding:12px 22px; border-radius:14px; font-weight:600;">Cancel</button>
      </div>
    </div>
  </div>

  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // If already logged in, skip to dashboard
      if (window.AuthManager && window.AuthManager.getUser()) {
        window.location.href = 'index.html';
        return;
      }

      const tabLogin = document.getElementById('tabLogin');
      const tabSignup = document.getElementById('tabSignup');
      const loginForm = document.getElementById('loginForm');
      const signupForm = document.getElementById('signupForm');

      function showMsg(elId, msg, type) {
        const el = document.getElementById(elId);
        if (!el) return;
        el.textContent = msg;
        el.className = 'auth-msg ' + type;
        el.style.display = 'block';
      }

      function setLoading(btnId, loading, text) {
        const btn = document.getElementById(btnId);
        if (!btn) return;
        btn.disabled = loading;
        btn.textContent = loading ? '⏳ Please wait...' : text;
      }

      tabLogin.onclick = () => {
        tabLogin.classList.add('active');
        tabSignup.classList.remove('active');
        loginForm.style.display = '';
        signupForm.style.display = 'none';
      };

      tabSignup.onclick = () => {
        tabSignup.classList.add('active');
        tabLogin.classList.remove('active');
        signupForm.style.display = '';
        loginForm.style.display = 'none';
      };

      loginForm.onsubmit = async (e) => {
        e.preventDefault();
        const email = document.getElementById('loginEmail').value.trim();
        const pass = document.getElementById('loginPassword').value;
        const remember = document.getElementById('rememberMe').checked;
        setLoading('loginSubmitBtn', true, 'Sign In to Life OS');
        try {
          const res = await window.AuthManager.login(email, pass, remember);
          setLoading('loginSubmitBtn', false, 'Sign In to Life OS');
          if (res.success) {
            showMsg('loginMsg', '✅ Success! Loading dashboard...', 'success');
            setTimeout(() => {
              const base = window.location.href.replace(/login\.html.*$/, '');
              window.location.href = base + 'index.html';
            }, 300);
          } else {
            showMsg('loginMsg', '❌ ' + (res.error || 'Login failed. Check your credentials.'), 'error');
          }
        } catch(err) {
          setLoading('loginSubmitBtn', false, 'Sign In to Life OS');
          showMsg('loginMsg', '❌ Error: ' + err.message, 'error');
          console.error('Login error:', err);
        }
      };

      signupForm.onsubmit = async (e) => {
        e.preventDefault();
        const name = document.getElementById('signupName').value.trim();
        const email = document.getElementById('signupEmail').value.trim();
        const pass = document.getElementById('signupPassword').value;
        if (pass.length < 6) {
          showMsg('signupMsg', '❌ Password must be at least 6 characters.', 'error');
          return;
        }
        setLoading('signupSubmitBtn', true, 'Create Life OS Account');
        try {
          const res = await window.AuthManager.signup(name, email, pass);
          setLoading('signupSubmitBtn', false, 'Create Life OS Account');
          if (res.success) {
            showMsg('signupMsg', '✅ Account created! Loading dashboard...', 'success');
            setTimeout(() => {
              const base = window.location.href.replace(/login\.html.*$/, '');
              window.location.href = base + 'index.html';
            }, 600);
          } else {
            showMsg('signupMsg', '❌ ' + (res.error || 'Signup failed.'), 'error');
          }
        } catch(err) {
          setLoading('signupSubmitBtn', false, 'Create Life OS Account');
          showMsg('signupMsg', '❌ Error: ' + err.message, 'error');
          console.error('Signup error:', err);
        }
      };

      document.getElementById('btnGoogleAuth').onclick = async () => {
        const btn = document.getElementById('btnGoogleAuth');
        btn.disabled = true;
        btn.textContent = '⏳ Redirecting to Google...';
        const res = await window.AuthManager.loginWithGoogle();
        if (!res.success) {
          btn.disabled = false;
          btn.innerHTML = `<svg width="20" height="20" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg> Continue with Google`;
          showMsg('loginMsg', '⚠️ ' + (res.error || 'Google login unavailable.'), 'error');
          document.getElementById('loginMsg').style.display = 'block';
        }
      };

      // Toggle password visibility
      document.querySelectorAll('.toggle-pass').forEach(btn => {
        btn.onclick = () => {
          const inp = document.getElementById(btn.dataset.target);
          inp.type = inp.type === 'password' ? 'text' : 'password';
          btn.textContent = inp.type === 'password' ? '👁️' : '🙈';
        };
      });

      // Forgot Password
      const forgotModal = document.getElementById('forgotModal');
      document.getElementById('forgotPasswordBtn').onclick = (e) => {
        e.preventDefault();
        const emailVal = document.getElementById('loginEmail').value;
        if (emailVal) document.getElementById('forgotEmail').value = emailVal;
        forgotModal.classList.add('open');
      };
      document.getElementById('forgotCancelBtn').onclick = () => forgotModal.classList.remove('open');
      document.getElementById('forgotSubmitBtn').onclick = async () => {
        const email = document.getElementById('forgotEmail').value.trim();
        const res = await window.AuthManager.forgotPassword(email);
        const msgEl = document.getElementById('forgotMsg');
        msgEl.textContent = res.success ? ('✅ ' + res.message) : ('❌ ' + res.error);
        msgEl.className = 'auth-msg ' + (res.success ? 'success' : 'error');
        msgEl.style.display = 'block';
        if (res.success) setTimeout(() => forgotModal.classList.remove('open'), 3000);
      };
    });
  </script>
</body>
</html>
